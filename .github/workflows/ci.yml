name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest --cov=oscal_ssp_generator --cov-report=term-missing

      - name: Smoke-test the CLI
        run: |
          oscal-ssp-generator examples/terraform.tfstate -o /tmp/ssp.json --no-banner
          python -c "import json; d=json.load(open('/tmp/ssp.json')); assert d['system-security-plan']['metadata']['oscal-version'] == '1.1.2'"

  lint:
    name: Validate examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON examples parse
        run: |
          python -c "import json; json.load(open('examples/terraform.tfstate'))"
          python -c "import json; json.load(open('examples/aws_inventory.json'))"

  oscal-schema:
    name: Validate OSCAL output against NIST schema
    runs-on: ubuntu-latest
    env:
      # NIST OSCAL v1.1.2 SSP schema, pinned by SHA-256.
      OSCAL_SCHEMA_URL: https://github.com/usnistgov/OSCAL/releases/download/v1.1.2/oscal_ssp_schema.json
      OSCAL_SCHEMA_SHA256: 08d3faeb12f0fab7705dec15fb648c72400c7ab6ac0056222d49d21507e02a69
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . jsonschema
      - name: Download schema
        run: |
          mkdir -p schemas
          curl -sSfL "$OSCAL_SCHEMA_URL" -o schemas/oscal_ssp_schema.json
          echo "$OSCAL_SCHEMA_SHA256  schemas/oscal_ssp_schema.json" | sha256sum -c -
      - name: Validate the SSP generated from each example
        run: |
          oscal-ssp-generator examples/terraform.tfstate -o /tmp/ssp_tf.json --no-banner
          oscal-ssp-generator examples/aws_inventory.json -o /tmp/ssp_inv.json --no-banner
          python tools/validate_oscal.py --schema schemas/oscal_ssp_schema.json /tmp/ssp_tf.json /tmp/ssp_inv.json
